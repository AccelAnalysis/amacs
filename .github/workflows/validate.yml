name: Validate AMACS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests
      - run: python scripts/export_csv.py --output dist/csv
      - run: python scripts/export_excel.py --output dist/AMACS-$(cat VERSION)-review.xlsx
      - run: python scripts/build_release.py --output dist/release --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: amacs-review-and-release-${{ github.sha }}
          path: dist/
          retention-days: 14
