name: Fortune 500 Research

on:
  pull_request:
    paths:
      - ".github/workflows/fortune-500-research.yml"
      - "scripts/analyze_fortune_500.py"
      - "research/fortune-500-2026/**"
      - "research/fortune-1000-2026/**"
      - "source/**"
      - "schemas/**"
      - "tests/test_fortune_500.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taxonomy-depth-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_fortune_500.py"
      - name: Retrieve pinned Fortune roster
        run: |
          curl --fail --silent --show-error --retry 3 \
            --cookie-jar /tmp/us500.cookies \
            --user-agent "Mozilla/5.0 (compatible; AMACS taxonomy research; +https://github.com/AccelAnalysis/amacs)" \
            https://us500.com/fortune-1000-companies \
            --output /tmp/us500-page.html
          curl --fail --silent --show-error --retry 3 \
            --cookie /tmp/us500.cookies \
            --referer https://us500.com/fortune-1000-companies \
            --header "Accept: application/json,text/plain,*/*" \
            --user-agent "Mozilla/5.0 (compatible; AMACS taxonomy research; +https://github.com/AccelAnalysis/amacs)" \
            https://us500.com/data/log8.json \
            --output /tmp/fortune-1000-2026.json
      - name: Retrieve pinned SEC-derived entity metadata
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/john-friedman/datamule-data/9fa9defaac2eb3ecc3e1a96e4c9153061f1986b3/data/filer_metadata/listed_filer_metadata.csv.gz \
            --output /tmp/listed_filer_metadata.csv.gz
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/john-friedman/datamule-data/9fa9defaac2eb3ecc3e1a96e4c9153061f1986b3/data/filer_metadata/listed_filer_names.csv.gz \
            --output /tmp/listed_filer_names.csv.gz
      - name: Run Fortune 500 taxonomy-depth analysis
        run: >-
          python scripts/analyze_fortune_500.py
          --source-file /tmp/fortune-1000-2026.json
          --listed-metadata-file /tmp/listed_filer_metadata.csv.gz
          --listed-names-file /tmp/listed_filer_names.csv.gz
          --output dist/research/fortune-500-2026
      - name: Upload governed research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fortune-500-taxonomy-depth
          path: dist/research/fortune-500-2026
          if-no-files-found: error
          retention-days: 30
