name: Fortune 500 Research

on:
  pull_request:
    paths:
      - ".github/workflows/fortune-500-research.yml"
      - "scripts/analyze_fortune_500.py"
      - "research/fortune-500-2026/**"
      - "research/fortune-1000-2026/**"
      - "source/**"
      - "schemas/**"
      - "tests/test_fortune_500.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-depth-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_fortune_500.py"
      - name: Retrieve pinned Fortune roster
        run: |
          curl --fail --silent --show-error --retry 3 \
            --cookie-jar /tmp/us500.cookies \
            --user-agent "Mozilla/5.0 (compatible; AMACS taxonomy research; +https://github.com/AccelAnalysis/amacs)" \
            https://us500.com/fortune-1000-companies \
            --output /tmp/us500-page.html
          curl --fail --silent --show-error --retry 3 \
            --cookie /tmp/us500.cookies \
            --referer https://us500.com/fortune-1000-companies \
            --header "Accept: application/json,text/plain,*/*" \
            --user-agent "Mozilla/5.0 (compatible; AMACS taxonomy research; +https://github.com/AccelAnalysis/amacs)" \
            https://us500.com/data/log8.json \
            --output /tmp/fortune-1000-2026.json
      - name: Retrieve SEC company registry
        run: |
          curl --fail --silent --show-error --retry 3 \
            --header "Accept: application/json" \
            --user-agent "AccelAnalysis-AMACS/0.3 https://github.com/AccelAnalysis/amacs" \
            https://www.sec.gov/files/company_tickers.json \
            --output /tmp/sec-company-tickers.json
      - name: Run Fortune 500 evidence-depth analysis
        run: >-
          python scripts/analyze_fortune_500.py
          --source-file /tmp/fortune-1000-2026.json
          --sec-tickers-file /tmp/sec-company-tickers.json
          --output dist/research/fortune-500-2026
          --fetch-filings
          --max-filings 500
          --request-delay 0.12
      - name: Upload governed research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fortune-500-evidence-depth
          path: dist/research/fortune-500-2026
          if-no-files-found: error
          retention-days: 30
